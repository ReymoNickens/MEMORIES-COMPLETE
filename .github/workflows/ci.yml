name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared unit tests
        working-directory: packages/shared
        env:
          EVOLVEIT_DEMO: '1'
        run: node --experimental-strip-types --test src/crypto.test.ts
